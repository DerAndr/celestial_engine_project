name: Build Android Companion APK

on:
  push:
    paths:
      - 'android/**'
      - 'tools/preflight_check.py'
      - '.github/workflows/android-build.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Kotlin 2.0 & JUnit 4 Preflight Check
        run: python3 tools/preflight_check.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Run Unit Tests & Build Debug APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Version APK & Sync with Latest GitHub Release
        id: version_apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ANDROID_VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts || echo "1.4.0")
          cp android/app/build/outputs/apk/debug/app-debug.apk "celestial_companion_v${ANDROID_VER}.apk"
          echo "android_ver=${ANDROID_VER}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_name }}" = "master" ]; then
            LATEST_TAG=$(gh release view --json tagName -q .tagName || echo "")
            if [ -n "$LATEST_TAG" ]; then
              for attempt in 1 2 3; do
                if gh release upload "$LATEST_TAG" "celestial_companion_v${ANDROID_VER}.apk" --clobber; then
                  break
                fi
                echo "Release asset upload attempt $attempt failed; retrying in 5s..."
                sleep 5
              done
            fi
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: celestial-companion-v${{ steps.version_apk.outputs.android_ver }}-apk
          path: celestial_companion_v*.apk
          if-no-files-found: error
