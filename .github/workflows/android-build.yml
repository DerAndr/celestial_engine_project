name: Build Android Companion APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Version APK & Sync with Latest GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ANDROID_VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts || echo "1.1.2")
          cp android/app/build/outputs/apk/debug/app-debug.apk "celestial_companion_v${ANDROID_VER}.apk"
          echo "ANDROID_VER=${ANDROID_VER}" >> $GITHUB_ENV
          if [ "${{ github.ref_name }}" = "master" ]; then
            LATEST_TAG=$(gh release view --json tagName -q .tagName || echo "")
            if [ -n "$LATEST_TAG" ]; then
              gh release upload "$LATEST_TAG" "celestial_companion_v${ANDROID_VER}.apk" --clobber
            fi
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: celestial-companion-v${{ env.ANDROID_VER }}-apk
          path: celestial_companion_v*.apk
          if-no-files-found: error
