name: Core Engine CI

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - 'android/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test-python:
    name: Run Python Protocol & Transport Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f tools/requirements-brain.txt ]; then pip install -r tools/requirements-brain.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -v

  lint-and-validate:
    name: Validate Scripts & Schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JSON configuration files
        run: |
          if [ -f tools/brain_config.json ]; then python -c "import json; json.load(open('tools/brain_config.json'))"; fi
          python -c "import json; json.load(open('tools/brain_config.example.json'))"

      - name: Check Shell Scripts Syntax
        run: |
          bash -n tools/start_monitor.sh
